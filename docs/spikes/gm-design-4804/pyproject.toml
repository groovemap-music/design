# SPDX-License-Identifier: MIT
# Throwaway harness for spike gm-design-4804. Not a product package, and no GrooveMap
# service depends on it. It measures genre and style structure, lifecycle stability, and
# atlas layout stability over two Discogs dumps, and taste projection on synthetic data.
[project]
name = "spike-gm-design-4804"
version = "0.0.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "lxml==6.1.3",
    "numpy==2.5.4",
    "scipy==1.18.1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
