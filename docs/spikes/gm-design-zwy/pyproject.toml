# SPDX-License-Identifier: MIT
# Throwaway harness for spike gm-design-zwy. Not a product package, and no GrooveMap
# service depends on it: Semantica is confined to this isolated research environment.
[project]
name = "spike-gm-design-zwy"
version = "0.0.0"
# Semantica 0.7.0 declares >=3.10,<3.14; GrooveMap services run 3.14, so this
# environment is pinned to 3.13 and kept apart from every service.
requires-python = ">=3.13,<3.14"
dependencies = [
    "semantica==0.7.0",
    "lxml==6.1.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
