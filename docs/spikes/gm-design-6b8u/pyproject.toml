# SPDX-License-Identifier: MIT
# Throwaway harness for spike gm-design-6b8u. Not a product package, and no GrooveMap
# service depends on it. It streams the MusicBrainz full export into compact link history
# and evaluates gm-design-loj9's GO bar on real months.

[project]
name = "spike-gm-design-6b8u"
version = "0.0.0"
requires-python = ">=3.13,<3.16"
dependencies = [
    "numpy==2.3.4",
    "orjson==3.12.0",
    "lxml==6.1.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
