name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required:
    uses: groovemap-music/automation/.github/workflows/reusable-ci.yml@833cb464507678c38ab78bd4718ce697399463e9
    with:
      runner: ubuntu-24.04
      language: mixed
      setup-command: just setup
      check-command: just check
      coverage-command: just coverage
      audit-command: just audit
      license-command: just license-check
      secret-scan-command: just secret-scan
      package-command: just build
      install-command: just install-check
      coverage-files: coverage/lcov.info
      coverage-flags: design
